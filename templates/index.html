<!DOCTYPE html>
<html>
<head><title>ComicCraft</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
    <div class="container">
        <h1>🎨 ComicCraft</h1>
        <form action="/generate" method="post">
            <div class="form-group"><label>Story Prompt</label><textarea name="story_prompt" required></textarea></div>
            <div class="form-group"><label>Character Name</label><input type="text" name="character_name" value="Felix" required></div>
            <div class="form-group"><label>Setting</label><input type="text" name="setting" value="Enchanted Forest" required></div>
            <div class="form-group"><label>Tone</label><select name="tone"><option>Dramatic</option><option>Funny</option></select></div>
            <div class="form-group"><label>Art Style</label><select name="art_style"><option>Anime</option><option>Comic Book</option></select></div>
            <button type="submit">Generate Comic</button>
        </form>
    </div>
</body>
</html>
